[workspace]
name = "vinca-rs"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

# vinca-rs as a conda package: `pixi build`, or as a source dependency of another
# workspace (e.g. RoboStack's): vinca-rs = { git = "https://github.com/Tobias-Fischer/vinca-rs" }
[package]
name = "vinca-rs"
version = "0.1.5"

[package.build.backend]
name = "pixi-build-rust"
channels = ["https://prefix.dev/conda-forge"]

[package.build.config]
binaries = ["vinca-rs"]
# cargo's own git (libgit2) can't check out pixi's long test file names on Windows;
# the git CLI can, with core.longpaths
env = { CARGO_NET_GIT_FETCH_WITH_CLI = "true" }

[package.build-dependencies]
# pixi-build-ros' dependencies need a recent compiler
rust = ">=1.97"

# development
[dependencies]
rust = ">=1.97"

[tasks]
build = "cargo build --release"
test = "cargo test"
fmt = "cargo fmt"
lint = { cmd = "cargo clippy --all-targets -- -D warnings", depends-on = ["fmt"] }

# RoboStack's tooling environment supports glibc 2.17 (CentOS 7)
[workspace.target.linux-64.build-variants]
c_stdlib_version = ["2.17"]

[workspace.target.linux-aarch64.build-variants]
c_stdlib_version = ["2.17"]
