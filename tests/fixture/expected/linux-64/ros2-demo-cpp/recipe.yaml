# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-demo-cpp
  version: 1.2.3
source:
  git: https://github.com/example/demo-release.git
  tag: release/humble/demo_cpp/1.2.3-1
  target_directory: ros2-demo-cpp/src/work
  patches:
  - patch/ros2-demo-cpp.patch
build:
  number: 3
  script: build_ament_cmake.sh
  post_process:
  - files:
    - '*.pc'
    regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
    replacement: $$(CONDA_BUILD_SYSROOT_S)
  - files:
    - '*.cmake'
    regex: ([^;\s"]+/sysroot)
    replacement: $$ENV{CONDA_BUILD_SYSROOT}
  - files:
    - '*.cmake'
    regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
    replacement: $$ENV{CONDA_BUILD_SYSROOT}
requirements:
  build:
  - ${{ compiler('cxx') }}
  - ${{ compiler('c') }}
  - ${{ stdlib('c') }}
  - ninja
  - python ${{ python_min | default('3.11') }}.*
  - setuptools
  - git
  - git-lfs
  - patch
  - make
  - coreutils
  - cmake
  - cython
  - if: build_platform != target_platform
    then:
    - pkg-config
  - if: build_platform != target_platform
    then:
    - python ${{ python_min | default('3.11') }}.*
  - if: build_platform != target_platform
    then:
    - cross-python_${{ target_platform }}
  - if: build_platform != target_platform
    then:
    - numpy
  host:
  - eigen
  - libfoo-linux >=1.0
  - ros2-ament-cmake
  - ros2-distro-mutex 0.7.* humble_*
  - ros2-ros-environment
  - ros2-ros-workspace
  - zlib
  run:
  - eigen
  - libfoo-linux
  - ros2-distro-mutex 0.7.* humble_*
  - ros2-ros-workspace
tests:
- package_contents:
    files:
    - share/demo_cpp/package.xml
- package_contents:
    strict: false
    files:
      not_exists:
      - '**/site-packages/**'
      - '**/*.cpython-*.so'
      - '**/*.pyd'
about:
  homepage: https://example.com/demo
  repository: https://github.com/example/demo
  license: LGPL-2.0-only OR GPL-2.0-only
  summary: A C++ demo package.
extra:
  recipe-maintainers:
  - ros-forge
