# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros2-demo-py
  version: 0.4.0
source:
  git: https://github.com/example/demo-release.git
  tag: release/humble/demo_py/0.4.0-1
  target_directory: ros2-demo-py/src/work
  patches:
  - patch/ros2-demo-py.unix.patch
build:
  number: 7
  script: build_ament_python.sh
  post_process:
  - files:
    - '*.pc'
    regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
    replacement: $$(CONDA_BUILD_SYSROOT_S)
  - files:
    - '*.cmake'
    regex: ([^;\s"]+/sysroot)
    replacement: $$ENV{CONDA_BUILD_SYSROOT}
  - files:
    - '*.cmake'
    regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
    replacement: $$ENV{CONDA_BUILD_SYSROOT}
requirements:
  build:
  - ${{ compiler('cxx') }}
  - ${{ compiler('c') }}
  - ${{ stdlib('c') }}
  - ninja
  - python
  - setuptools
  - git
  - git-lfs
  - patch
  - make
  - coreutils
  - cmake
  - cython
  - if: build_platform != target_platform
    then:
    - pkg-config
  - if: build_platform != target_platform
    then:
    - python
  - if: build_platform != target_platform
    then:
    - cross-python_${{ target_platform }}
  - if: build_platform != target_platform
    then:
    - numpy
  host:
  - numpy
  - pip
  - python
  - ros2-distro-mutex 0.7.* humble_*
  - ros2-ros-environment
  - ros2-ros-workspace
  - setuptools
  - if: build_platform == target_platform
    then:
    - pkg-config
  run:
  - libfoo-linux
  - numpy
  - python
  - ros2-demo-cpp
  - ros2-distro-mutex 0.7.* humble_*
  - ros2-ros-workspace
tests:
- package_contents:
    files:
    - share/demo_py/package.xml
- script:
  - python -c "import demo_py"
  requirements:
    run:
    - pytest
- script:
  - echo linux-humble
about:
  license: BSD-3-Clause
  summary: A Python demo package.
extra:
  recipe-maintainers:
  - ros-forge
