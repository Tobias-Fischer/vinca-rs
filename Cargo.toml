[package]
name = "vinca-rs"
version = "0.1.9"
edition = "2024"
description = "Conda (rattler-build) recipe and CI workflow generator for ROS distributions (RoboStack)"
repository = "https://github.com/Tobias-Fischer/vinca-rs"
license = "MIT"
publish = false

[[bin]]
name = "vinca-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs-err = "3"
indexmap = { version = "2", features = ["serde"] }
miette = { version = "7", features = ["fancy"] }
minijinja = "2"
# package.xml parsing (REP 149 conditions)
# pixi-build-ros from the end of the unmerged pixi PRs (Tobias-Fischer/pixi
# pixi-build-ros-requirements). Merge order: #7533 (shared lookup) and #7539 (names),
# then #7540 (build scripts), then #7541 (requirement rules); repin to prefix-dev/pixi after.
pixi-build-ros = { git = "https://github.com/Tobias-Fischer/pixi.git", rev = "ab454118bb154cf316a2de1881750085e163bf76" }
# which builds are published: prefix-dev/rattler-build#2943, until merged
rattler_build_core = { git = "https://github.com/Tobias-Fischer/rattler-build.git", rev = "44e5ee79dd2f845e6a87189ec006ad36b29910fa", default-features = false, features = ["rustls"] }
rattler_build_recipe = "0.1.25"
rattler_build_variant_config = "0.1.25"
rattler_conda_types = { version = "0.58", default-features = false }
# pixi's repodata fetching (with tokio and url): sharded repodata, compression, HTTP caching
rattler_repodata_gateway = { version = "0.38", default-features = false, features = ["gateway", "rustls"] }
rattler_solve = { version = "13", default-features = false, features = ["resolvo"] }
rattler_virtual_packages = { version = "8.1", default-features = false }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
