[package]
name = "vinca-rs"
version = "0.1.6"
edition = "2024"
description = "Conda (rattler-build) recipe and CI workflow generator for ROS distributions (RoboStack)"
repository = "https://github.com/Tobias-Fischer/vinca-rs"
license = "MIT"
publish = false

[[bin]]
name = "vinca-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs-err = "3"
indexmap = { version = "2", features = ["serde"] }
miette = { version = "7", features = ["fancy"] }
minijinja = "2"
# package.xml parsing (REP 149 conditions)
# the shared rosdep lookup (prefix-dev/pixi#7533), the license fix (#7534), and the
# requirement rules and build scripts (Tobias-Fischer/pixi pixi-build-ros-recipe-rules),
# until merged
pixi-build-ros = { git = "https://github.com/Tobias-Fischer/pixi.git", rev = "f5537595dc5a4b158e5af95333aef771972a5aab" }
# which builds are published: prefix-dev/rattler-build#2943 (on a rattler-build commit pixi's rattler crates resolve with), until merged
rattler_build_core = { git = "https://github.com/Tobias-Fischer/rattler-build.git", rev = "8e1623781dc656bb230ad668c693217c47c15d2b", default-features = false, features = ["rustls"] }
rattler_build_recipe = "0.1.24"
rattler_build_variant_config = "0.1.24"
rattler_conda_types = { version = "0.58", default-features = false }
# pixi's repodata fetching (with tokio and url): sharded repodata, compression, HTTP caching
rattler_repodata_gateway = { version = "0.38", default-features = false, features = ["gateway", "rustls"] }
rattler_solve = { version = "12", default-features = false, features = ["resolvo"] }
rattler_virtual_packages = { version = "8.1", default-features = false }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
