[package]
name = "vinca-rs"
version = "0.1.6"
edition = "2024"
description = "Conda (rattler-build) recipe and CI workflow generator for ROS distributions (RoboStack)"
repository = "https://github.com/Tobias-Fischer/vinca-rs"
license = "MIT"
publish = false

[[bin]]
name = "vinca-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs-err = "3"
indexmap = { version = "2", features = ["serde"] }
miette = { version = "7", features = ["fancy"] }
minijinja = "2"
# package.xml parsing (REP 149 conditions)
# the shared rosdep lookup: Tobias-Fischer/pixi pixi-build-ros-shared-map (prefix-dev/pixi#7533), until it is merged
pixi-build-ros = { git = "https://github.com/Tobias-Fischer/pixi.git", rev = "a5e2ce6186c2c4143838b8db209c81843c8b8a4f" }
rattler_build_recipe = "0.1.24"
rattler_build_variant_config = "0.1.24"
rattler_conda_types = { version = "0.58", default-features = false }
# pixi's repodata fetching (with tokio and url): sharded repodata, compression, HTTP caching
rattler_repodata_gateway = { version = "0.38", default-features = false, features = ["gateway", "rustls"] }
rattler_solve = { version = "12", default-features = false, features = ["resolvo"] }
rattler_virtual_packages = { version = "8.1", default-features = false }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
spdx = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
