# The vinca-rs conda package of every platform RoboStack builds for, attached to a
# GitHub release for a v* tag: RoboStack depends on these (pixi url dependencies)
# instead of compiling vinca-rs in every CI job.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-15-intel, platform: osx-64 }
          - { os: macos-15, platform: osx-arm64 }
          - { os: windows-2022, platform: win-64 }
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.83.0
          run-install: false
      - run: pixi build --output-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: conda-${{ matrix.platform }}
          path: dist/*.conda
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          (cd dist && sha256sum *.conda > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "vinca-rs $GITHUB_REF_NAME: conda packages for linux-64, linux-aarch64, osx-64, osx-arm64 and win-64."
